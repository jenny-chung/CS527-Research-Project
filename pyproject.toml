[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "id-flakies"
version = "0.1.0"
description = "Automatic detection and repair of implementation-dependent flaky tests in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Brandon Li", email = "bcli3@illinois.edu" },
    { name = "Jenny Chung", email = "jennyc3@illinois.edu" },
]
dependencies = [
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]

[project.entry-points.pytest11]
id_flakies = "id_flakies.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["id_flakies*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["eval_dataset", "tests"]
pythonpath = ["."]
addopts = "-v"
